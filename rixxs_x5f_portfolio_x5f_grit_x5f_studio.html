ototype",note:"Window, player movement, single enemy type, no scoring."},{ver:"v0.5 — core loop",note:"Shooting, lives, scoring, basic waves, menu structure."},{ver:"v0.9 — polish",note:"Particles, screen effects, audio, performance pass, executable build."}],screenshots:["SCENE_01","SCENE_02","SCENE_03"],links:{github:"",download:"",release:""},featured:!0},{id:"orb-runner",name:"Orb Runner",short:"Experimental orbital mechanic prototype — testing momentum and risk/reward.",category:"GAMES",type:"lab",status:"EXPERIMENTAL",version:"0.2.1-EXPERIMENT",tech:["Python","Pygame"],platform:"WIN_X64",overview:"Orb Runner is where I test ideas that might not work. Core question: can you make orbiting feel good with only Python? I’m prototyping a mechanic where you are an orb tethered to a gravity well, slingshotting to collect nodes while avoiding debris. It’s not finished. The movement is floaty right now and I’m still tuning friction and centripetal force. I’m keeping it intentionally small so I can throw it away if the core isn’t fun.",challenges:"Simulating orbital mechanics without overcomplicating math. Making failure readable.",decisions:"Prototype in <500 lines before adding assets. No menus until movement feels right.",lessons:"If it’s not fun in grey boxes, art won’t save it.",versionHistory:[{ver:"v0.1",note:"Basic orbit prototype"},{ver:"v0.2",note:"Tether mechanic test"}],screenshots:["ORB_01"],links:{github:"",download:"",release:""},featured:!1},{id:"calculator",name:"Calculator",short:"A practical desktop utility turned into a complete application.",category:"APPS",type:"app",status:"COMPLETE",version:"1.3.0",tech:["Python","Tkinter","CustomTkinter"],platform:"WIN_X64",overview:"I built Calculator because I wanted to finish something people can actually use daily. It started as eval() — which I quickly learned to never ship. Now it has a safe parser, history, keyboard support, theme persistence, and proper error handling. It taught me that even simple apps have edge cases: division by zero, long expressions, theme switching mid-calculation. Turning a script into an application means handling the boring parts well.",challenges:"Safe evaluation, keyboard focus, layout on resize.",decisions:"Custom parser over eval. JSON for history. CustomTkinter for modern look without Electron overhead.",lessons:"Utility apps live or die on keyboard support and startup time.",versionHistory:[{ver:"v1.0",note:"Basic operations"},{ver:"v1.3",note:"History, themes, keyboard"}],screenshots:["CALC_01"],links:{github:"",download:"",release:""},featured:!1},{id:"clock-timer",name:"Clock & Timer",short:"Timekeeping lab — alarms, timers, and persistent settings.",category:"APPS",type:"app",status:"IN DEVELOPMENT",version:"0.7.4-DEV",tech:["Python","Tkinter","JSON"],platform:"WIN_X64",overview:"Clock & Timer is my productivity experiment. I wanted a clock that isn’t distracting and a timer that I actually trust for focus sessions. Current build has world clock, stopwatch, countdown, and JSON-based settings persistence. Dark mode is implemented. [planned] Pomodoro integration, desktop notifications, and always-on-top mini mode are still in design. I’m learning that time-based apps need rock-solid state handling — you can’t lose a timer because the window lost focus.",challenges:"Accurate timing without drift, settings corruption recovery, alarm scheduling.",decisions:"JSON for settings with schema validation. Monotonic clock for timers.",lessons:"System time is not reliable for elapsed time.",versionHistory:[{ver:"v0.4",note:"Clock + stopwatch"},{ver:"v0.7",note:"Timers + persistence"}],screenshots:["CLOCK_01"],links:{github:"",download:"",release:""},featured:!1},{id:"grit-launcher",name:"Grit Studio Launcher",short:"Future distribution home for studio products — early concept.",category:"LAB",type:"lab",status:"CONCEPT",version:"0.0.3-CONCEPT",tech:["C#","Windows Forms"],platform:"WIN_X64",overview:"Grit Launcher is the long game. Right now it’
